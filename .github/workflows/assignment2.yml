name: Assignment 2 validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assignment2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify dataset exists
        run: |
          test -s df_file.csv
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("df_file.csv")
          print("Dataset shape:", df.shape)
          print("Columns:", list(df.columns))
          if df.empty or len(df.columns) < 2:
              raise SystemExit("Dataset CSV is empty or has fewer than two columns.")
          PY

      - name: Execute notebook from a clean kernel
        run: |
          jupyter nbconvert --to notebook --execute assignment_2.ipynb --output assignment_2_executed.ipynb --ExecutePreprocessor.timeout=1800

      - name: Generate PDF report
        run: python report/generate_report.py

      - name: Validate deliverables
        run: python scripts/validate_outputs.py

      - name: Upload executed notebook, report, and metrics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: assignment-2-deliverables
          path: |
            assignment_2_executed.ipynb
            report/report.pdf
            report/generated/metrics.json
            report/generated/model_comparison.csv
            report/generated/figures/*.png
          if-no-files-found: error
          retention-days: 7
